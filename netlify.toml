# ============================================================
# Netlify Configuration — Multi-Environment
# ============================================================
# Staging site: deploys from `main` branch
# Production site: deploys from `production` branch
# ============================================================

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,FIREBASE_PROJECT_ID,FINIK_API_KEY,FINIK_SECRET_KEY"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"

# ---- Context: Production branch ----
[context.production]
  command = "npm run build:prod"

# ---- Context: Branch deploys & Deploy Previews ----
[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

# ---- Old domain: planula.org → sabakhub.kg, page for page, so search engines
# and AI answers move their links over. Needs planula.org as a domain alias. ----
[[redirects]]
  from = "https://planula.org/*"
  to = "https://sabakhub.kg/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://planula.org/*"
  to = "https://sabakhub.kg/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.planula.org/*"
  to = "https://sabakhub.kg/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.planula.org/*"
  to = "https://sabakhub.kg/:splat"
  status = 301
  force = true

# ---- SPA routing — all non-file routes go to the empty shell ----
# index.html and /<page>.html are prerendered public pages (scripts/prerender.mjs);
# app routes get app.html so they never flash the landing page's markup.
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200

# ---- Functions ----
[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"
  included_files = ["netlify/functions/**"]

# ---- Scheduled functions (cron) ----
# Daily debt/payment reminders to students + overdue alerts to admins.
[functions."debt-reminders"]
  schedule = "0 9 * * *"

# Monthly auto-billing: generate invoices for monthly-format courses on the 1st.
[functions."monthly-billing"]
  schedule = "0 6 1 * *"

# Monthly payroll accrual: open the previous month's payslip period and run the
# first calculation. Never approves and never pays — money needs a human.
# An hour after monthly-billing so that month's invoices are already in place.
[functions."payroll-accrual"]
  schedule = "0 7 1 * *"

# Evening reminder of tomorrow's lessons to students & teachers.
[functions."lesson-reminders"]
  schedule = "0 14 * * *"

# 21:00 Бишкек: преподавателю — сегодняшние занятия без отмеченной переклички.
[functions."journal-reminders"]
  schedule = "0 15 * * *"

# Weekly owner digest (Monday morning): revenue, debts, new students & leads.
[functions."weekly-digest"]
  schedule = "0 6 * * 1"

# Daily morning AI brief to directors (Telegram): state of the business + priority actions.
# 03:00 UTC ≈ 09:00 in Kyrgyzstan (UTC+6).
[functions."morning-brief"]
  schedule = "0 3 * * *"

# Daily reminder to follow up on untouched leads.
[functions."lead-followups"]
  schedule = "0 8 * * *"

# Weekly alert of at-risk students (absences / overdue payments) to staff.
[functions."risk-alerts"]
  schedule = "0 7 * * 3"

# Daily super-admin digest of org subscriptions expiring/overdue + auto-block past grace.
[functions."subscription-reminders"]
  schedule = "0 10 * * *"

# ---- Security headers ----
# frame-src must list every host the app actually puts in an <iframe>, or the
# browser paints "Это содержимое заблокировано" in place of the embed:
#   youtube / youtube-nocookie / player.vimeo — lesson video (LessonViewPage)
#   firebasestorage + 'self' + blob:          — PDF preview (FileViewerModal, DocumentViewerPage)
#   view.officeapps.live.com                  — Office preview (getViewerUrl)
#   www.openstreetmap.org                     — branch map (PublicOrgProfilePage)
#   *.firebaseapp.com, accounts.google.com    — Firebase Auth iframe
# Note: `*.youtube.com` does NOT match the bare `youtube.com`, hence both.
# Hashed build output and self-hosted fonts never change under the same URL.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-Pi5sjuXquUWfdQfRCOw/PSYj/daitMiZM6ii4shWqRA=' https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleapis.com https://*.googleusercontent.com https://firebasestorage.googleapis.com; media-src 'self' blob: https://firebasestorage.googleapis.com https://*.youtube.com https://*.ytimg.com; connect-src 'self' https://*.googleapis.com https://*.firebaseapp.com https://apis.google.com https://*.firebaseio.com https://*.cloudfunctions.net https://firebaseinstallations.googleapis.com https://fcmregistrations.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://generativelanguage.googleapis.com wss://*.firebaseio.com; frame-src 'self' blob: https://youtube.com https://*.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://firebasestorage.googleapis.com https://view.officeapps.live.com https://www.openstreetmap.org https://*.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'self'"
